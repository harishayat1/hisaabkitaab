<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#060B14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HisaabKitaab">
<meta name="description" content="Personal AI Financial Manager for Pakistan">
<title>HisaabKitaab</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%2300C897'/><stop offset='1' stop-color='%2300A67D'/></linearGradient></defs><rect fill='url(%23g)' width='100' height='100' rx='22'/><text x='50' y='68' text-anchor='middle' fill='white' font-size='52' font-weight='700' font-family='system-ui'>HK</text></svg>">
<style>
:root {
  --bg: #060B14;
  --bg-secondary: #0A101F;
  --surface: #0D1322;
  --surface-hover: #111827;
  --border: rgba(255,255,255,0.04);
  --border-light: rgba(255,255,255,0.08);
  --accent: #00C897;
  --accent-dim: rgba(0,200,151,0.10);
  --accent-glow: rgba(0,200,151,0.20);
  --gold: #D4A843;
  --gold-dim: rgba(212,168,67,0.12);
  --danger: #E8515C;
  --danger-dim: rgba(232,81,92,0.10);
  --text-primary: #FFFFFF;
  --text-secondary: #8B95A5;
  --text-muted: #5A6577;
  --radius-sm: 10px;
  --radius: 16px;
  --radius-lg: 20px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
  --shadow: 0 4px 12px rgba(0,0,0,0.4);
  --shadow-lg: 0 8px 30px rgba(0,0,0,0.5);
  --transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
  --font-mono: "SF Mono", "JetBrains Mono", "Fira Code", monospace;
  --max-w: 480px;
}

* { margin:0; padding:0; box-sizing:border-box; }
html { -webkit-tap-highlight-color:transparent; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow: hidden;
  height: 100vh; height: 100dvh;
  font-variant-numeric: tabular-nums;
  -webkit-font-variant-numeric: tabular-nums;
}

#app {
  display: flex; flex-direction: column;
  height: 100vh; height: 100dvh;
  max-width: var(--max-w); margin: 0 auto;
  position: relative;
}

/* === Status Bar === */
.status-bar {
  padding: 14px 20px 8px;
  display: flex; align-items: center; justify-content: space-between;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
}
.status-brand {
  font-size: 18px; font-weight: 700; letter-spacing: -0.3px;
  color: var(--text-primary);
}
.status-badge {
  display: flex; align-items: center; gap: 6px;
  font-size: 10px; font-weight: 600; letter-spacing: 0.5px;
  color: var(--accent); text-transform: uppercase;
  background: var(--accent-dim); padding: 4px 10px; border-radius: 20px;
}
.status-dot { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 6px var(--accent); }

/* === Content Area === */
#content {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  padding: 0 16px;
  -webkit-overflow-scrolling: touch;
  scroll-behavior: smooth;
}
#content::-webkit-scrollbar { width: 0; }
#content > * { animation: fadeIn 0.3s ease; }

/* === Glass Card === */
.glass-card, .card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
  transition: var(--transition);
  position: relative;
  overflow: hidden;
}
.glass-card::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0;
  height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.04), transparent);
}
.glass-card:active { transform: scale(0.99); background: var(--surface-hover); }

/* === Hero / Net Worth === */
.hero-card {
  background: linear-gradient(135deg, #0D1F2D 0%, #0D1322 50%, #121025 100%);
  border: 1px solid rgba(0,200,151,0.12);
  border-radius: var(--radius-lg);
  padding: 24px 20px;
  margin-bottom: 16px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.hero-card::after {
  content: ""; position: absolute;
  width: 180px; height: 180px;
  background: radial-gradient(circle, rgba(0,200,151,0.06) 0%, transparent 70%);
  top: -40px; right: -40px; border-radius: 50%;
}
.hero-label { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1.5px; font-weight: 600; margin-bottom: 4px; }
.hero-amount { font-size: 40px; font-weight: 800; letter-spacing: -1px; color: var(--text-primary); font-family: var(--font-mono); }
.hero-subtitle { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
.hero-row { display: flex; justify-content: center; gap: 24px; margin-top: 12px; }
.hero-stat { text-align: center; }
.hero-stat-val { font-size: 15px; font-weight: 700; }
.hero-stat-lbl { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

/* === Stat Cards === */
.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
.stat-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 14px 10px; text-align: center;
  transition: var(--transition);
}
.stat-card:active { background: var(--surface-hover); }
.stat-icon { font-size: 20px; margin-bottom: 4px; }
.stat-val { font-size: 16px; font-weight: 700; margin-bottom: 1px; }
.stat-lbl { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.3px; }

/* === Section Header === */
.section-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px; margin-top: 4px;
}
.section-title { font-size: 14px; font-weight: 700; letter-spacing: -0.2px; color: var(--text-primary); }
.section-link { font-size: 12px; color: var(--accent); font-weight: 500; cursor: pointer; }

/* === Transaction Row === */
.txn-row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: var(--transition);
}
.txn-row:last-child { border-bottom: none; }
.txn-row:active { opacity: 0.7; }
.txn-icon {
  width: 40px; height: 40px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0; position: relative;
}
.txn-info { flex: 1; min-width: 0; }
.txn-name { font-size: 14px; font-weight: 500; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.txn-meta { font-size: 11px; color: var(--text-muted); display: flex; gap: 8px; margin-top: 2px; }
.txn-amount { font-size: 14px; font-weight: 700; font-family: var(--font-mono); white-space: nowrap; }
.txn-badge {
  font-size: 9px; font-weight: 600; letter-spacing: 0.3px;
  padding: 2px 7px; border-radius: 6px;
}

/* === Buttons === */
.btn-primary, .btn-secondary, .btn-ghost, .btn-danger {
  border: none; cursor: pointer; font-family: var(--font);
  font-weight: 600; font-size: 13px; letter-spacing: -0.1px;
  transition: var(--transition); border-radius: 12px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.btn-primary {
  background: linear-gradient(135deg, #00C897 0%, #00A67D 100%);
  color: #000; padding: 12px 22px;
  box-shadow: 0 4px 14px rgba(0,200,151,0.25);
}
.btn-primary:active { transform: scale(0.97); opacity: 0.9; }
.btn-secondary {
  background: var(--surface); color: var(--text-primary);
  padding: 12px 22px; border: 1px solid var(--border-light);
}
.btn-secondary:active { background: var(--surface-hover); }
.btn-ghost {
  background: transparent; color: var(--text-secondary);
  padding: 10px 16px;
}
.btn-ghost:active { color: var(--text-primary); }
.btn-danger { background: var(--danger-dim); color: var(--danger); padding: 12px 22px; }
.btn-danger:active { background: rgba(232,81,92,0.20); }
.btn-icon {
  width: 44px; height: 44px; border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  background: var(--surface); border: 1px solid var(--border-light);
  cursor: pointer; font-size: 20px; transition: var(--transition);
}
.btn-icon:active { background: var(--surface-hover); transform: scale(0.95); }

/* === FAB === */
.fab {
  position: fixed; bottom: 90px; right: max(16px, calc((100vw - var(--max-w))/2 + 16px));
  width: 52px; height: 52px; border-radius: 16px;
  background: linear-gradient(135deg, #00C897, #00A67D);
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; color: #000; cursor: pointer;
  box-shadow: 0 8px 24px rgba(0,200,151,0.35);
  border: none; z-index: 50;
  transition: var(--transition);
}
.fab:active { transform: scale(0.9); }

/* === Floating Tab Bar === */
.tab-bar-wrap {
  padding: 8px 16px;
  padding-bottom: max(8px, env(safe-area-inset-bottom));
  background: var(--bg);
}
.tab-bar {
  display: flex; background: var(--surface);
  border: 1px solid var(--border); border-radius: 18px;
  padding: 4px; backdrop-filter: blur(20px);
}
.tab-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  gap: 2px; padding: 8px 4px;
  border: none; background: none; color: var(--text-muted);
  font-size: 10px; font-weight: 500; cursor: pointer;
  border-radius: 14px; transition: var(--transition);
  font-family: var(--font); letter-spacing: 0.1px;
}
.tab-btn.active { color: var(--accent); background: var(--accent-dim); }
.tab-btn .tab-icon { font-size: 18px; line-height: 1; }
.tab-btn:active { opacity: 0.7; }

/* === Chips === */
.chip-row { display: flex; gap: 8px; flex-wrap: wrap; padding: 4px 0; margin-bottom: 8px; }
.chip {
  padding: 6px 14px; border-radius: 20px;
  font-size: 12px; font-weight: 500; cursor: pointer;
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text-muted); white-space: nowrap;
  transition: var(--transition);
}
.chip.active { background: var(--accent-dim); border-color: var(--accent-glow); color: var(--accent); }
.chip:active { transform: scale(0.97); }

/* === Search === */
.search-bar {
  display: flex; align-items: center; gap: 10px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 10px 14px; margin-bottom: 10px;
}
.search-bar input {
  flex: 1; background: none; border: none; color: var(--text-primary);
  font-size: 14px; font-family: var(--font); outline: none;
}
.search-bar input::placeholder { color: var(--text-muted); }

/* === Progress Bar === */
.progress-bar { height: 6px; background: rgba(255,255,255,0.05); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 3px; transition: width 0.6s cubic-bezier(0.4,0,0.2,1); }

/* === Inputs === */
.inp, .sel {
  width: 100%; padding: 12px 14px; font-family: var(--font); font-size: 14px;
  background: rgba(255,255,255,0.03); border: 1px solid var(--border);
  border-radius: 12px; color: var(--text-primary); outline: none;
  transition: var(--transition);
}
.inp:focus, .sel:focus { border-color: var(--accent); background: rgba(0,200,151,0.03); }
.inp::placeholder { color: var(--text-muted); }

/* === Modal === */
.modal-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
  display: flex; align-items: flex-end; justify-content: center;
  padding: 16px; padding-bottom: max(16px, env(safe-area-inset-bottom));
  animation: fadeIn 0.2s ease;
}
.modal {
  background: var(--surface); border: 1px solid var(--border-light);
  border-radius: var(--radius-lg); padding: 20px;
  width: 100%; max-width: var(--max-w); max-height: 80vh;
  overflow-y: auto; animation: slideUp 0.3s cubic-bezier(0.4,0,0.2,1);
}

/* === Toast === */
#toast {
  position: fixed; top: 60px; left: 50%; transform: translateX(-50%);
  z-index: 300; pointer-events: none;
}
.toast-msg {
  background: var(--surface); border: 1px solid var(--border-light);
  border-radius: 30px; padding: 10px 20px;
  font-size: 13px; font-weight: 500; color: var(--text-primary);
  box-shadow: var(--shadow-lg);
  animation: slideDown 0.3s ease, fadeOut 0.3s ease 2s forwards;
  text-align: center; white-space: nowrap;
}

/* === Badges === */
.badge { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 8px; letter-spacing: 0.3px; white-space: nowrap; }
.badge-success { background: var(--accent-dim); color: var(--accent); }
.badge-warning { background: var(--gold-dim); color: var(--gold); }
.badge-danger { background: var(--danger-dim); color: var(--danger); }

/* === Alerts === */
.alert { padding: 14px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; margin-bottom: 12px; cursor: pointer; transition: var(--transition); }
.alert-red { background: var(--danger-dim); border: 1px solid rgba(232,81,92,0.2); color: var(--danger); }
.alert-green { background: var(--accent-dim); border: 1px solid var(--accent-glow); color: var(--accent); text-align: center; }

/* === Shimmer / Skeleton === */
.shimmer {
  background: linear-gradient(90deg, var(--surface) 25%, var(--surface-hover) 50%, var(--surface) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.8s infinite;
  border-radius: 8px;
}
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

/* === Group Header === */
.group-header {
  font-size: 11px; font-weight: 700; color: var(--text-muted);
  padding: 16px 0 6px; text-transform: uppercase; letter-spacing: 1px;
}

/* === Tabs === */
.tabs {
  display: flex; background: var(--surface); border-radius: 12px;
  padding: 3px; margin-bottom: 14px; border: 1px solid var(--border);
}
.tab {
  flex: 1; text-align: center; padding: 8px 6px; border-radius: 10px;
  font-size: 11px; font-weight: 600; color: var(--text-muted);
  cursor: pointer; transition: var(--transition); letter-spacing: 0.1px;
}
.tab.active { background: var(--accent-dim); color: var(--accent); }

/* === Empty State === */
.empty { text-align: center; padding: 48px 20px; color: var(--text-muted); }
.empty-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.5; }

/* === Upload Zone === */
.upload-zone {
  background: var(--surface); border: 2px dashed rgba(255,255,255,0.08);
  border-radius: var(--radius-lg); padding: 40px; text-align: center;
  cursor: pointer; margin-bottom: 12px; transition: var(--transition);
}
.upload-zone:hover, .upload-zone:active { border-color: var(--accent); background: var(--accent-dim); }

/* === Spinner === */
.spinner {
  width: 28px; height: 28px; border: 2.5px solid var(--border-light);
  border-top-color: var(--accent); border-radius: 50%;
  animation: spin 0.8s linear infinite; margin: 0 auto;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* === Ring === */
.ring-container { position: relative; display: inline-flex; align-items: center; justify-content: center; }
.ring-text { position: absolute; font-weight: 700; color: var(--accent); }

/* === Chat === */
.chat-msg {
  max-width: 88%; padding: 12px 16px; border-radius: 16px;
  margin-bottom: 8px; font-size: 13px; line-height: 1.6; animation: fadeIn 0.2s ease;
}
.chat-msg.user { margin-left: auto; background: var(--accent); color: #000; border-bottom-right-radius: 6px; }
.chat-msg.bot { margin-right: auto; background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 6px; }

/* === Quick Actions Grid === */
.quick-actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
.quick-action {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 14px 8px; text-align: center;
  cursor: pointer; transition: var(--transition);
}
.quick-action:active { background: var(--surface-hover); transform: scale(0.97); }
.quick-action-icon { font-size: 22px; margin-bottom: 4px; }
.quick-action-label { font-size: 10px; color: var(--text-muted); font-weight: 500; }

/* === Category Row === */
.cat-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; font-size: 13px; }
.cat-row:not(:last-child) { border-bottom: 1px solid var(--border); }

/* === Animations === */
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
@keyframes slideDown { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
@keyframes fadeOut { to { opacity: 0; transform: translateY(-10px); } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

/* === Divider === */
.divider { height: 1px; background: var(--border); margin: 12px 0; }

/* === Insurance / Feature Highlight === */
.feature-strip {
  display: flex; gap: 12px; overflow-x: auto; padding: 4px 0 12px;
  scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch;
}
.feature-strip::-webkit-scrollbar { display: none; }
.feature-card {
  min-width: 140px; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 14px; scroll-snap-align: start;
  flex-shrink: 0;
}
.feature-card-icon { font-size: 24px; margin-bottom: 6px; }
.feature-card-title { font-size: 12px; font-weight: 600; color: var(--text-primary); }
.feature-card-desc { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
</style>
</head>
<body>
<div id="app">
  <div class="status-bar">
    <div class="status-brand">HisaabKitaab</div>
    <div class="status-badge"><span class="status-dot"></span>Secure</div>
  </div>
  <div id="content"><div id="loading" style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-muted);font-size:14px">Loading your vault...</div></div>
  <div class="tab-bar-wrap">
    <nav class="tab-bar">
      <button class="tab-btn active" onclick="AppState.currentScreen='dashboard';renderPage()"><span class="tab-icon">◉</span>Overview</button>
      <button class="tab-btn" onclick="AppState.currentScreen='transactions';renderPage()"><span class="tab-icon">▣</span>Activity</button>
      <button class="tab-btn" onclick="AppState.currentScreen='analytics';renderPage()"><span class="tab-icon">▷</span>Insights</button>
      <button class="tab-btn" onclick="AppState.currentScreen='loans';renderPage()"><span class="tab-icon">◇</span>Udhaar</button>
      <button class="tab-btn" onclick="AppState.currentScreen='settings';renderPage()"><span class="tab-icon">◆</span>More</button>
    </nav>
  </div>
  <div id="modal"></div>
  <div id="toast"></div>
</div>
<script>document.getElementById("loading").textContent="Preparing your secure vault...";</script>
<script src="app.js?v=2"></script>
</body>
</html>
