<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0A0E1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HisaabKitaab">
<meta name="description" content="Personal AI Financial Manager for Pakistan">
<title>HisaabKitaab</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%2300D09E' width='100' height='100' rx='20'/><text x='50' y='68' text-anchor='middle' fill='white' font-size='50' font-weight='bold'>HK</text></svg>">
<style>
:root {
  --bg: #0A0E1A;
  --surface: #131929;
  --surface-elevated: #1C2540;
  --accent: #00D09E;
  --danger: #FF4757;
  --gold: #FFD700;
  --text: #ffffff;
  --text-secondary: #8892A4;
  --radius: 12px;
  --max-w: 600px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  overflow: hidden;
  height: 100vh;
  height: 100dvh;
}
#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  max-width: var(--max-w);
  margin: 0 auto;
}
#content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 12px 12px 0;
  -webkit-overflow-scrolling: touch;
}
#content::-webkit-scrollbar { width: 0; }

/* Tab Bar */
.tab-bar {
  display: flex;
  background: var(--surface);
  border-top: 1px solid var(--surface-elevated);
  padding: 4px 8px;
  padding-bottom: max(4px, env(safe-area-inset-bottom));
}
.tab-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 6px 0;
  border: none;
  background: none;
  color: var(--text-secondary);
  font-size: 10px;
  cursor: pointer;
  transition: color 0.2s;
}
.tab-btn.active { color: var(--accent); }
.tab-btn .tab-icon { font-size: 20px; }

/* Typography */
.title { font-size: 20px; font-weight: 700; color: var(--text); }
.subtitle { font-size: 15px; font-weight: 600; color: var(--text); }
.h2 { font-size: 28px; font-weight: 700; }
.h3 { font-size: 18px; font-weight: 700; }
.amount-large { font-size: 32px; font-weight: 700; }
.small { font-size: 11px; }
.text-secondary { color: var(--text-secondary); }
.text-pri { color: var(--text); }
.link { color: var(--accent); cursor: pointer; font-size: 13px; }

/* Cards */
.card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 12px;
}
.net-worth {
  text-align: center;
  border: 1px solid rgba(0, 208, 158, 0.2);
}
.stat-card {
  flex: 1;
  background: var(--surface);
  border-radius: var(--radius);
  padding: 12px 8px;
  text-align: center;
}

/* Rows */
.row { display: flex; align-items: center; }
.sb { justify-content: space-between; }
.gap-8 { gap: 8px; }
.gap-12 { gap: 12px; }
.gap-16 { gap: 16px; }
.gap-20 { gap: 20px; }
.gap-0 { gap: 0; }

/* Transaction Row */
.txn-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid var(--surface-elevated);
}
.txn-icon {
  width: 36px; height: 36px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; flex-shrink: 0;
}
.txn-info { flex: 1; min-width: 0; }
.txn-amt { font-weight: 600; font-size: 14px; white-space: nowrap; }
.txn-row:last-child { border-bottom: none; }

/* Chips */
.chip-row { display: flex; gap: 6px; flex-wrap: wrap; padding: 6px 0; }
.chip {
  padding: 4px 10px;
  border-radius: 14px;
  font-size: 11px;
  background: var(--surface-elevated);
  color: var(--text-secondary);
  cursor: pointer;
  white-space: nowrap;
  border: 1px solid transparent;
  transition: all 0.15s;
}
.chip.active { background: var(--accent); color: #000; }
.chip:hover { opacity: 0.8; }

/* Bank Chip */
.bank-chip {
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 12px;
  cursor: pointer;
  border: 2px solid var(--surface-elevated);
  color: var(--text-secondary);
  transition: all 0.15s;
}
.bank-chip.selected { border-width: 2px; color: var(--text); }

/* Buttons */
.btn-primary {
  background: var(--accent);
  color: #000;
  border: none;
  padding: 10px 18px;
  border-radius: 20px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}
.btn-secondary {
  background: var(--surface-elevated);
  color: var(--text);
  border: none;
  padding: 10px 18px;
  border-radius: 20px;
  font-size: 14px;
  cursor: pointer;
}
.fab-btn {
  flex: 1;
  background: var(--surface-elevated);
  color: var(--text-secondary);
  border: none;
  padding: 10px;
  border-radius: 10px;
  font-size: 13px;
  cursor: pointer;
}
.full-width { width: 100%; display: block; }

/* Progress */
.progress-bar {
  height: 8px;
  background: var(--surface-elevated);
  border-radius: 4px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  border-radius: 4px;
  transition: width 0.5s ease;
}

/* Inputs */
.inp {
  width: 100%;
  padding: 10px 12px;
  background: var(--surface-elevated);
  border: 1px solid var(--surface-elevated);
  border-radius: 8px;
  color: var(--text);
  font-size: 14px;
  outline: none;
}
.inp:focus { border-color: var(--accent); }
.sel {
  padding: 8px 10px;
  background: var(--surface-elevated);
  border: 1px solid var(--surface-elevated);
  border-radius: 8px;
  color: var(--text);
  font-size: 13px;
  outline: none;
}

/* Search */
.search-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: var(--surface-elevated);
  border-radius: 20px;
  margin-bottom: 8px;
}
.search-bar input {
  flex: 1;
  background: none;
  border: none;
  color: var(--text);
  font-size: 14px;
  outline: none;
}
.search-bar input::placeholder { color: var(--text-secondary); }

/* Group Header */
.group-header {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  padding: 8px 0 4px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* Empty State */
.empty {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-secondary);
  font-size: 14px;
}

/* Alerts */
.alert-red {
  background: rgba(255, 71, 87, 0.15);
  border: 1px solid var(--danger);
  color: var(--danger);
  padding: 12px;
  border-radius: var(--radius);
  font-size: 13px;
  cursor: pointer;
  margin-bottom: 12px;
}
.alert-green {
  background: rgba(0, 208, 158, 0.15);
  border: 1px solid var(--accent);
  color: var(--accent);
  padding: 12px;
  border-radius: var(--radius);
  font-size: 13px;
  text-align: center;
  margin-bottom: 12px;
}

/* Badge */
.badge {
  padding: 2px 8px;
  border-radius: 8px;
  font-size: 9px;
  font-weight: 700;
  white-space: nowrap;
}

/* Category Row */
.cat-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  font-size: 14px;
}

/* Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  z-index: 1000;
  padding: 16px;
  padding-bottom: max(16px, env(safe-area-inset-bottom));
}
.modal {
  background: var(--surface);
  border-radius: 16px;
  padding: 20px;
  width: 100%;
  max-width: var(--max-w);
  max-height: 80vh;
}

/* Upload Zone */
.upload-zone {
  background: var(--surface);
  border: 2px dashed var(--accent);
  border-radius: 16px;
  padding: 40px 20px;
  text-align: center;
  cursor: pointer;
  margin-bottom: 12px;
}

/* Spinner */
.spinner {
  width: 32px; height: 32px;
  border: 3px solid var(--surface-elevated);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Tabs */
.tabs {
  display: flex;
  background: var(--surface);
  border-radius: 10px;
  padding: 3px;
  margin-bottom: 12px;
}
.tab {
  flex: 1;
  text-align: center;
  padding: 8px;
  border-radius: 8px;
  font-size: 12px;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.2s;
}
.tab.active { background: var(--accent); color: #000; }

/* Ring */
.ring-container {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin: 8px 0;
}
.ring-text {
  position: absolute;
  font-size: 18px;
  font-weight: 700;
  color: var(--gold);
}

/* Chat */
.chat-msg {
  max-width: 85%;
  padding: 10px 14px;
  border-radius: 14px;
  margin-bottom: 8px;
  font-size: 13px;
  line-height: 1.5;
}
.chat-msg.user {
  margin-left: auto;
  background: var(--accent);
  color: #000;
  border-bottom-right-radius: 4px;
}
.chat-msg.bot {
  margin-right: auto;
  background: var(--surface-elevated);
  color: var(--text);
  border-bottom-left-radius: 4px;
}

/* Overscroll */
#content { overscroll-behavior-y: contain; }
</style>
</head>
<body>
<div id="app">
  <div id="content"><div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8892A4">Loading...</div></div>
  <div id="modal"></div>
  <nav class="tab-bar">
    <button class="tab-btn active" onclick="AppState.currentScreen='dashboard';renderPage()">
      <span class="tab-icon">🏠</span><span>Home</span>
    </button>
    <button class="tab-btn" onclick="AppState.currentScreen='transactions';renderPage()">
      <span class="tab-icon">💳</span><span>Txns</span>
    </button>
    <button class="tab-btn" onclick="AppState.currentScreen='analytics';renderPage()">
      <span class="tab-icon">📊</span><span>Analytics</span>
    </button>
    <button class="tab-btn" onclick="AppState.currentScreen='loans';renderPage()">
      <span class="tab-icon">🤝</span><span>Udhaar</span>
    </button>
    <button class="tab-btn" onclick="AppState.currentScreen='settings';renderPage()">
      <span class="tab-icon">⚙️</span><span>Settings</span>
    </button>
  </nav>
</div>
<script src="app.js"></script>
</body>
</html>
